name = "miniworld-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "miniworld-db-prod"
database_id = "0ed9b08c-d179-4aeb-bd8b-883befe7970b"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "miniworld-assets"

[env.development]
[env.development.vars]
ENVIRONMENT = "development"

[[env.development.d1_databases]]
binding = "DB"
database_name = "miniworld-db-dev"
database_id = "4bd03fe6-3672-41fc-bb56-b014bcc0d098"

[[env.development.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "miniworld-assets-dev"